name: Release

# Push a version tag (for example v0.1.1-rc.1) after the release commit is verified.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  check:
    name: Validate release and run checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Run Release from a version tag such as v0.1.1 or v0.1.1-rc.1.' >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: pnpm check

  build:
    name: Release installer (${{ matrix.platform }} ${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-15
            target: dmg
            suffix: mac-arm64.dmg
          - platform: mac
            arch: x64
            runner: macos-15-intel
            target: dmg
            suffix: mac-x64.dmg
          - platform: win
            arch: x64
            runner: windows-2025
            target: nsis
            suffix: win-x64.exe
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            target: AppImage
            suffix: linux-x86_64.AppImage
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package installer
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CERT_PFX_BASE64 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CERT_PASSWORD || '' }}
        run: |
          options=("--$PLATFORM" "$TARGET" "--$ARCH" --publish never "-c.extraMetadata.version=$RELEASE_VERSION")
          if [[ "$PLATFORM" == mac && -z "$CSC_LINK" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            options+=(-c.mac.identity=- -c.mac.notarize=false)
          fi
          pnpm exec electron-builder "${options[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/Navo-${{ needs.check.outputs.version }}-${{ matrix.suffix }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish downloadable GitHub Release
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: installers
          merge-multiple: true
      - name: Verify complete installer set and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          cd installers
          files=(
            "Navo-$RELEASE_VERSION-mac-arm64.dmg"
            "Navo-$RELEASE_VERSION-mac-x64.dmg"
            "Navo-$RELEASE_VERSION-win-x64.exe"
            "Navo-$RELEASE_VERSION-linux-x86_64.AppImage"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            # A retry may finish uploading an existing draft, but never replace a public release.
            jq -e '.isDraft == true' release-state.json > /dev/null
          else
            cat > release-notes.md <<'NOTES'
          Download the installer matching your system below. SHA256SUMS.txt contains checksums for all four installers.

          下载对应系统的安装包，校验值见 SHA256SUMS.txt。macOS 分 Apple 芯片和 Intel 两个版本。

          Signing depends on the repository release certificates. Without them, macOS builds use ad hoc signing without Apple notarization, and Windows builds are unsigned.
          NOTES
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Navo $RELEASE_VERSION" --generate-notes --notes-file release-notes.md "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
