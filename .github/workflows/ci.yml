name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # bundling the renderer (Monaco and friends) needs more than Node's default heap on the runners
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  check:
    name: Typecheck · Lint · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the PDF / OCR tests render Chinese text; the runner image has no CJK font
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm i18n:check
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E (Electron + Playwright)
    needs: check
    # the suites drive a real Electron window and use the system sqlite3 CLI
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # e2e/my-browser.mjs loads the Navo extension into Playwright's Chromium
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      # packaging regressions (native modules, asar paths, bundling) only show up in a real build
      - run: pnpm dist -- --mac dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-e2e-diagnostics
          path: |
            /tmp/ab-*/
            /tmp/navo-*/
            ~/Library/Logs/Navo/
          if-no-files-found: ignore

  e2e-linux-packaged:
    name: Linux packaged smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm dist -- --linux dir
      - run: xvfb-run -a node e2e/packaged.mjs release/linux-unpacked/navo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packaged-logs
          path: ~/.config/navo/logs
          if-no-files-found: ignore

  desktop-windows:
    name: Windows desktop helper + Electron E2E
    needs: check
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Native helper self-test (no desktop input)
        shell: pwsh
        run: |
          & .\dist\desktop\win-x64\navo-desktop.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Both tests run the native helper in --fake mode, without touching the runner desktop.
      - run: node e2e/desktop-helper.mjs
      - run: node e2e/desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-diagnostics
          path: |
            ${{ runner.temp }}/ab-*/
            ${{ runner.temp }}/navo-*/
            ${{ runner.temp }}/**/*.log
          if-no-files-found: ignore
