version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns: ['@langchain/*', 'langchain', 'deepagents', 'langsmith']
      langfuse:
        patterns: ['@langfuse/*', '@opentelemetry/*']
      ui:
        patterns: ['react', 'react-dom', 'radix-ui', 'lucide-react', 'tailwindcss', '@tailwindcss/*', 'sonner']
      tooling:
        dependency-type: development
    ignore:
      # Electron majors need a manual check of native modules (better-sqlite3)
      - dependency-name: electron
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
